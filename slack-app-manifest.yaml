# Slack app manifest for agy-slack-bridge.
# Slack: https://api.slack.com/apps -> Create New App -> From an app manifest -> paste this file.
# Then (manifests cannot do this part): create an App-Level Token with the
# `connections:write` scope and install the app. See docs/slack-app.md (ja) / docs/slack-app.en.md.
display_information:
  name: agy-slack-bridge
  description: Talk to your Antigravity CLI (agy) projects from Slack
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: agy
    always_online: false
  shortcuts:
    - name: Open in Web UI
      type: message
      callback_id: agy_open_web_ui
      description: Open this thread's conversation in the Antigravity web UI
  slash_commands:
    - command: /agy-permissions
      description: Manage this channel's command permissions
      usage_hint: list | add <command> | remove <command|number> | stats [days]
      should_escape: false
    - command: /agy-model
      description: Show or switch this channel's model
      usage_hint: list | set <model id> [effort] | clear
      should_escape: false
    - command: /agy-usage
      description: Show remaining model quota
      should_escape: false
    - command: /agy-stats
      description: Usage statistics settings and reports for this channel
      usage_hint: on|off <feature> [all] | buttons [days]
      should_escape: false
    - command: /agy
      description: Run an agy slash command (usage, credits, skills, plan, ...)
      usage_hint: <command> [args]
      should_escape: false
    - command: /agy-link
      description: Link to this channel's latest conversation in the web UI
      usage_hint: "[conversation id]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - channels:history
      - groups:history
      - commands
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
