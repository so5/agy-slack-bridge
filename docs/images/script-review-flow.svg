<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo','Segoe UI',sans-serif" role="img" aria-label="許可ボタンの前の自動チェック">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b2740"/></linearGradient>
<linearGradient id="agy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5bdb"/><stop offset="1" stop-color="#27389b"/></linearGradient>
<linearGradient id="chk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0a4f4a"/></linearGradient>
<linearGradient id="ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#166534"/></linearGradient>
<linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#78350f"/></linearGradient>
<linearGradient id="slack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b2a63"/><stop offset="1" stop-color="#3a1a40"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="660" rx="28" fill="url(#bg)"/>
<text x="60" y="70" font-size="34" fill="#fff" font-weight="700">許可ボタンの前の自動チェック</text>
<text x="60" y="106" font-size="18" fill="#94a3b8">スクリプトを実行するコマンドが拒否されたとき。AI の判定は参考で、ボタンは消えない。</text>
<rect x="60" y="155" width="170" height="90" rx="16" fill="url(#agy)" filter="url(#sh)"/>
<text x="145.0" y="196.0" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">拒否された</text>
<text x="145.0" y="220.0" font-size="13" fill="#cbd5e1" text-anchor="middle">スクリプト実行コマンド</text>
<path d="M232 200 H256" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<polygon points="260,200 390,134 520,200 390,266" fill="url(#chk)" filter="url(#sh)"/>
<text x="390" y="186" font-size="13" fill="#99f6e4" text-anchor="middle">1段目</text>
<text x="390" y="206" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">実害の出る操作が</text>
<text x="390" y="226" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">ある?</text>
<polygon points="586,200 716,134 846,200 716,266" fill="url(#chk)" filter="url(#sh)"/>
<text x="716" y="186" font-size="13" fill="#99f6e4" text-anchor="middle">2段目</text>
<text x="716" y="206" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">依頼どおりの</text>
<text x="716" y="226" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">処理だけ?</text>
<path d="M522 200 H584" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="534" y="190" font-size="14" fill="#fbbf24" font-weight="700">ある</text>
<path d="M390 268 V340" stroke="#4ade80" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="402" y="300" font-size="14" fill="#4ade80" font-weight="700">ない</text>
<rect x="260" y="344" width="260" height="90" rx="16" fill="url(#ok)" filter="url(#sh)"/>
<text x="390.0" y="385.0" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">自動で一時許可 → 再実行</text>
<text x="390.0" y="409.0" font-size="13" fill="#dcfce7" text-anchor="middle">ボタンなし。会話の間だけ有効</text>
<text x="390" y="456" font-size="12" fill="#86efac" text-anchor="middle">全文を点検済みの、単純なコマンドのとき</text>
<path d="M716 268 V340" stroke="#4ade80" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="728" y="300" font-size="14" fill="#4ade80" font-weight="700">どおり</text>
<rect x="586" y="344" width="260" height="90" rx="16" fill="url(#slack)" filter="url(#sh)"/>
<text x="716.0" y="385.0" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">操作を一覧表示</text>
<text x="716.0" y="409.0" font-size="13" fill="#cbd5e1" text-anchor="middle">そのまま許可ボタン</text>
<path d="M848 200 H946" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="860" y="190" font-size="14" fill="#fbbf24" font-weight="700">ちがう・不明</text>
<rect x="950" y="155" width="210" height="90" rx="16" fill="url(#ng)" filter="url(#sh)"/>
<text x="1055.0" y="196.0" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">警告と理由を表示</text>
<text x="1055.0" y="220.0" font-size="13" fill="#fde68a" text-anchor="middle">許可 + 「要約を見る」ボタン</text>
<path d="M1055 247 V340" stroke="#a5b4fc" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="1067" y="300" font-size="14" fill="#a5b4fc" font-weight="700">押されたとき</text>
<rect x="950" y="344" width="210" height="90" rx="16" fill="url(#agy)" filter="url(#sh)"/>
<text x="1055.0" y="385.0" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3段目: 要約と内容</text>
<text x="1055.0" y="409.0" font-size="13" fill="#cbd5e1" text-anchor="middle">スレッドに表示（約20秒）</text>
<rect x="60" y="500" width="340" height="110" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#475569"/>
<text x="80" y="540" font-size="16" fill="#fff" font-weight="700">点検できなかった・60KB超</text>
<text x="80" y="572" font-size="13" fill="#cbd5e1">ボタン（その旨を添える）</text>
<rect x="430" y="500" width="340" height="110" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#475569"/>
<text x="450" y="540" font-size="16" fill="#fff" font-weight="700">リダイレクト・パイプなど</text>
<text x="450" y="572" font-size="13" fill="#cbd5e1">1段目が問題なしでも、ボタン</text>
<rect x="800" y="500" width="340" height="110" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#475569"/>
<text x="820" y="540" font-size="16" fill="#fff" font-weight="700">各段階は別の agy 呼び出し</text>
<text x="820" y="572" font-size="13" fill="#cbd5e1">--project なし・空の一時ディレクトリ・plan モード</text>
</svg>