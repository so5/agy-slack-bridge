<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo','Segoe UI',sans-serif" role="img" aria-label="Drive your local agy from Slack">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b2740"/></linearGradient>
<linearGradient id="slack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b2a63"/><stop offset="1" stop-color="#3a1a40"/></linearGradient>
<linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0a4f4a"/></linearGradient>
<linearGradient id="agy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5bdb"/><stop offset="1" stop-color="#27389b"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<text x="60" y="70" font-size="34" fill="#ffffff" font-weight="700" text-anchor="start">Drive your local agy from Slack</text>
<text x="60" y="106" font-size="18" fill="#94a3b8" font-weight="400" text-anchor="start">One channel = one agy project. Approve with buttons.</text>
<rect x="60" y="140" width="300" height="290" rx="20" fill="url(#slack)" filter="url(#sh)"/>
<text x="84" y="180" font-size="24" fill="#ffffff" font-weight="700" text-anchor="start">Slack</text>
<text x="84" y="204" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start"># secretary</text>
<rect x="84" y="224" width="252" height="40" rx="12" fill="#ffffff" fill-opacity=".14"/>
<text x="98" y="250" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">@agy tidy up the invoices</text>
<rect x="84" y="276" width="252" height="76" rx="12" fill="#ffffff" fill-opacity=".10"/>
<text x="98" y="300" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Permission needed</text>
<rect x="98" y="312" width="104" height="28" rx="8" fill="#22c55e"/><text x="150" y="331" font-size="14" fill="#052e16" font-weight="700" text-anchor="middle">Once</text>
<rect x="212" y="312" width="110" height="28" rx="8" fill="#e2e8f0"/><text x="267" y="331" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Always</text>
<rect x="84" y="364" width="252" height="40" rx="12" fill="#ffffff" fill-opacity=".10"/>
<text x="98" y="390" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Done. result.pdf</text>
<rect x="450" y="140" width="300" height="290" rx="20" fill="url(#bridge)" filter="url(#sh)"/>
<text x="474" y="180" font-size="24" fill="#ffffff" font-weight="700" text-anchor="start">agy-slack-bridge</text>
<text x="474" y="204" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">Runs on your machine</text>
<circle cx="480" cy="235" r="14" fill="#ffffff" fill-opacity=".18"/><text x="480" y="240" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="506" y="240" font-size="15" fill="#f0fdfa" font-weight="400" text-anchor="start">Maps channels to projects</text>
<circle cx="480" cy="297" r="14" fill="#ffffff" fill-opacity=".18"/><text x="480" y="302" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="506" y="302" font-size="15" fill="#f0fdfa" font-weight="400" text-anchor="start">Buttons for denied actions</text>
<circle cx="480" cy="359" r="14" fill="#ffffff" fill-opacity=".18"/><text x="480" y="364" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="506" y="364" font-size="15" fill="#f0fdfa" font-weight="400" text-anchor="start">Replies with results and files</text>
<rect x="840" y="140" width="300" height="290" rx="20" fill="url(#agy)" filter="url(#sh)"/>
<text x="864" y="180" font-size="24" fill="#ffffff" font-weight="700" text-anchor="start">agy</text>
<text x="864" y="204" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">Runs in the project directory</text>
<rect x="864" y="222" width="252" height="48" rx="12" fill="#ffffff" fill-opacity=".18"/>
<text x="880" y="252" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Safety rules + hook</text>
<rect x="864" y="284" width="252" height="48" rx="12" fill="#ffffff" fill-opacity=".18"/>
<text x="880" y="314" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">deny rules (install dir, config)</text>
<rect x="864" y="346" width="252" height="48" rx="12" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="5 4"/>
<text x="880" y="376" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Google Drive CLI (optional)</text>
<line x1="366" y1="236" x2="444" y2="236" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<text x="405" y="222" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="middle">mention</text>
<line x1="756" y1="236" x2="834" y2="236" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<text x="795" y="222" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="middle">prompt</text>
<line x1="834" y1="330" x2="756" y2="330" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<text x="795" y="354" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="middle">denied</text>
<line x1="444" y1="380" x2="366" y2="380" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<text x="405" y="404" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="middle">results, files</text>
<rect x="60" y="470" width="360" height="72" rx="36" fill="#ffffff" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".35"/>
<circle cx="96" cy="506" r="12" fill="#2dd4bf"/>
<text x="122" y="513" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">1 channel = 1 project</text>
<rect x="440" y="470" width="360" height="72" rx="36" fill="#ffffff" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".35"/>
<circle cx="476" cy="506" r="12" fill="#2dd4bf"/>
<text x="502" y="513" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">Approve from your phone</text>
<rect x="820" y="470" width="360" height="72" rx="36" fill="#ffffff" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".35"/>
<circle cx="856" cy="506" r="12" fill="#2dd4bf"/>
<text x="882" y="513" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">Fenced by rules and a hook</text>
</svg>